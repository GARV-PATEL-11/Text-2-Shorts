# stages.yaml — model, effort and retry per stage (PROPOSED; replaces the STAGES dict in pipeline.py).
# Aliases resolve to the current model of that tier in Claude Code (`--model sonnet` etc.).
# Effort levels available depend on the model (low|medium|high|xhigh|max).
# All values are PROVISIONAL starting points — tune from log.jsonl measurements (Plan.md §23).
version: 1
defaults: {timeout_s: 1800, max_attempts: 2, backoff_s: [10, 40]}
stages:
  refine:          {model: haiku,  effort: low,    kind: llm,   cacheable: true}
  outline:         {model: sonnet, effort: high,   kind: llm,   cacheable: true}
  outline_review:  {model: sonnet, effort: medium, kind: llm,   cacheable: true, max_rounds: 1}
  outline_refactor:{model: sonnet, effort: medium, kind: llm,   cacheable: true, only_if: "review has ERROR defects"}
  clip_plan:       {model: sonnet, effort: high,   kind: llm,   cacheable: true, scope: scene}
  math_verify:     {model: sonnet, effort: high,   kind: llm,   cacheable: true, scope: video, escalate_model: opus}
  tts:             {kind: deterministic, cacheable: true, scope: clip}
  clip_build:      {model: sonnet, effort: high,   kind: agent, scope: clip, timeout_s: 2400,
                    retry: {model: sonnet, effort: xhigh}, final_retry: {model: opus, effort: high}}
  clip_review:     {model: sonnet, effort: medium, kind: llm,   scope: clip, only_if: "gates passed and code changed",
                    max_frames: 8, frame_width_px: 640}
  final_render:    {kind: deterministic, sandbox: bwrap, quality: h}
  assemble:        {kind: deterministic}
limits:
  max_clip_builds_per_clip: 3        # then FAILED → human checkpoint, never an endless loop
  max_review_rebuilds_per_clip: 1
  max_concurrent_llm_calls: 1        # sequential by requirement; raise only after measuring rate limits
