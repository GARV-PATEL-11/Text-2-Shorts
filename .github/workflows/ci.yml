# Deterministic test suite — no LLM calls.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update package lists and install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            texlive-latex-base \
            texlive-latex-extra \
            pkg-config \
            bubblewrap

      - name: Install uv
        run: pip install uv

      - name: Synchronize project dependencies
        run: uv sync

      - name: Run deterministic test suite
        run: uv run pytest -q
