# Deterministic checks — no LLM calls, no TTS, no network beyond package installs.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # manimpango and pycairo publish no Linux wheels: uv builds them against the Cairo and Pango headers.
      - name: Update package lists and install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            texlive-latex-base \
            texlive-latex-extra \
            pkg-config \
            build-essential \
            python3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            bubblewrap

      - name: Install uv
        run: pip install uv

      - name: Synchronize project dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run deterministic test suite
        run: uv run pytest -q
