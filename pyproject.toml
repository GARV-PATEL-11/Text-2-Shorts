[project]
name = "text-2-shorts"
version = "0.2.0"
description = "Topic in, narrated Manim explainer video out — every LLM stage is a sandboxed Claude Code run"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "manim==0.20.1",          # pinned: API index, topic cards and critic allowlist are version-specific
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "kokoro-onnx>=0.6.1",     # local TTS (default engine)
    "boto3==1.43.38",         # AWS Polly (optional TTS engine)
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=0.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
t2s = "app.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "schemas"]
