[project]
name = "text-2-shorts"
version = "0.35.0"
description = "Faraday — Curiosity, Illustrated: topic in, narrated Manim explainer video out; every LLM stage is a sandboxed Claude Code run"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "manim==0.20.1",          # pinned: API index, topic cards and critic allowlist are version-specific
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    "boto3==1.43.38",         # AWS Polly (default TTS)
    "google-cloud-texttospeech>=2.16",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=0.60.0",
    "ruff>=0.17.6",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[project.scripts]
text-2-shorts = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "backend/schemas"]

[tool.pyrefly]
search-path = ["backend", "backend/tools", "backend/templates", "tests", "runtime-environment", "runtime-environment/prompts"]
project-excludes = ["backend/templates/template_kit/**"]  # vendored as given

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixtures", "artifacts", "backend/templates/template_kit", "runtime-environment/template"]  # the kit is vendored as given

[tool.ruff.lint]
# subprocess.run without check=: every call reads returncode itself (gates, preflight, render) — failures are data
ignore = ["PLW1510"]

[tool.ruff.format]
quote-style = "preserve"
