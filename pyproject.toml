[project]
name = "text-2-shorts"
version = "0.9.0"
description = "Topic in, narrated Manim explainer video out — every LLM stage is a sandboxed Claude Code run"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "manim==0.20.1",          # pinned: API index, topic cards and critic allowlist are version-specific
    "pydantic>=2.13.4",
    "python-dotenv>=1.0",
    # local TTS (default engine)
    "boto3==1.43.38",         # AWS Polly (optional TTS engine)
    "google-cloud-texttospeech>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=0.60.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
text-2-shorts = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "schemas"]

[tool.pyrefly]
search-path = [".", "tools", "tests", "schemas"]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/fixtures", "runs", "external"]

[tool.ruff.format]
quote-style = "preserve"
